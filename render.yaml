# Render Blueprint: the website and API run as one Node web service, plus Postgres.
# Values marked `sync: false` are entered in the Render dashboard (never commit secrets).
services:
  - type: web
    name: new-world-emerald
    runtime: node
    # Deploys the main branch; every push to main goes live after CI-style checks in the build.
    branch: main
    autoDeploy: true
    buildCommand: bash scripts/render-build.sh
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_DIST_DIR
        value: artifacts/new-world-emerald/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: new-world-emerald-db
          property: connectionString
      - key: SCHOOL_ADMIN_EMAILS
        sync: false
      - key: SCHOOL_SUPER_ADMIN_EMAILS
        sync: false
      # The Director's email: sole access to /director and the Monday report. Must also be in SCHOOL_ADMIN_EMAILS.
      - key: SCHOOL_DIRECTOR_EMAILS
        sync: false
      # The secondary school principal's email (JSS 1 to SS 3): opens /principal only. Leave it out of SCHOOL_ADMIN_EMAILS unless they also need full office access.
      - key: SCHOOL_PRINCIPAL_EMAILS
        sync: false
      # The primary school principal's email (Year 1 to Year 6): opens /principal/primary only. Leave it out of SCHOOL_ADMIN_EMAILS unless they also need full office access.
      - key: SCHOOL_PRIMARY_PRINCIPAL_EMAILS
        sync: false
      # The exam officer's email: opens /exam-officer. When set, every exam waits for the exam officer to publish it.
      - key: SCHOOL_EXAM_OFFICER_EMAILS
        sync: false
      # The Head of School's email: opens /head and every portal (counts as an administrator), and emails teachers and parents.
      - key: SCHOOL_HEAD_EMAILS
        sync: false
      # Optional: how many emails the Director and Head of School may send in 24 hours (default 500). Match your Resend plan.
      - key: SCHOOL_EMAIL_DAILY_LIMIT
        sync: false
      - key: REQUIRE_ADMIN_MFA
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      # Paystack secret key (sk_live_... or sk_test_...) for parents paying school fees online.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # Media storage: Cloudinary (recommended). Takes priority over the bucket below.
      - key: CLOUDINARY_URL
        sync: false
      # "true" only after the school domain shows this site: sends the onrender.com address there.
      - key: FORWARD_TO_DOMAIN
        sync: false
      # Signing secret of the Clerk webhook that sends Clerk's emails through Resend (whsec_...).
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: GCS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false

databases:
  - name: new-world-emerald-db
    databaseName: new_world_emerald
    postgresMajorVersion: "16"
