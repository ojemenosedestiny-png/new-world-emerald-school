# Render Blueprint: the website and API run as one Node web service, plus Postgres.
# Values marked `sync: false` are entered in the Render dashboard (never commit secrets).
services:
  - type: web
    name: new-world-emerald
    runtime: node
    # Deploys the main branch; every push to main goes live after CI-style checks in the build.
    branch: main
    autoDeploy: true
    buildCommand: bash scripts/render-build.sh
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_DIST_DIR
        value: artifacts/new-world-emerald/dist/public
      - key: DATABASE_URL
        fromDatabase:
          name: new-world-emerald-db
          property: connectionString
      - key: SCHOOL_ADMIN_EMAILS
        sync: false
      - key: SCHOOL_SUPER_ADMIN_EMAILS
        sync: false
      - key: REQUIRE_ADMIN_MFA
        value: "false"
      - key: CSP_ENFORCE
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # Media storage: Cloudinary (recommended). Takes priority over the bucket below.
      - key: CLOUDINARY_URL
        sync: false
      # "true" only after the school domain shows this site: sends the onrender.com address there.
      - key: FORWARD_TO_DOMAIN
        sync: false
      # Signing secret of the Clerk webhook that sends Clerk's emails through Resend (whsec_...).
      - key: CLERK_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: GCS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PRIVATE_OBJECT_DIR
        sync: false
      - key: PUBLIC_OBJECT_SEARCH_PATHS
        sync: false

databases:
  - name: new-world-emerald-db
    databaseName: new_world_emerald
    postgresMajorVersion: "16"
