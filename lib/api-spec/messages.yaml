paths:
  myMessages:
    get:
      operationId: getMyMessages
      responses:
        "200":
          description: The signed-in student's conversations with their class teacher and the school office
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyMessages" }
    post:
      operationId: sendMyMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentMessageInput" }
      responses:
        "200":
          description: Message sent; returns the updated conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyMessages" }
  myMessagesRead:
    post:
      operationId: markMyMessagesRead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageReadInput" }
      responses:
        "200":
          description: Staff replies in that conversation are marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyMessages" }
  messageThreads:
    get:
      operationId: listMessageThreads
      responses:
        "200":
          description: Conversations the signed-in staff member can answer, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MessageThreadSummary" } }
  messageThread:
    get:
      operationId: getMessageThread
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer } }
        - { name: channel, in: path, required: true, schema: { $ref: "#/components/schemas/MessageChannel" } }
      responses:
        "200":
          description: One conversation; opening it marks the student's messages read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMessageThread" }
    post:
      operationId: replyMessageThread
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer } }
        - { name: channel, in: path, required: true, schema: { $ref: "#/components/schemas/MessageChannel" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageBodyInput" }
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMessageThread" }
  privateThread:
    get:
      operationId: getPrivateMessageThread
      description: A private conversation between a student and one teacher. Only that teacher (and the office, to keep students safe) may open it; opening it as the teacher marks the student's messages read
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer } }
        - { name: teacherId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMessageThread" }
    post:
      operationId: replyPrivateMessageThread
      description: The teacher answers the student privately (the office reads but does not answer)
      parameters:
        - { name: studentId, in: path, required: true, schema: { type: integer } }
        - { name: teacherId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageBodyInput" }
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMessageThread" }
schemas:
  MessageChannel:
    type: string
    enum: [class, office, teacher]
  PortalChatMessage:
    type: object
    required: [id, fromStaff, senderName, body, createdAt, read]
    properties:
      id: { type: integer }
      fromStaff: { type: boolean }
      senderName: { type: string }
      body: { type: string }
      createdAt: { type: string, format: date-time }
      read: { type: boolean }
  StudentThread:
    type: object
    required: [channel, title, unread, messages]
    properties:
      channel: { $ref: "#/components/schemas/MessageChannel" }
      title: { type: string }
      unread: { type: integer }
      messages: { type: array, items: { $ref: "#/components/schemas/PortalChatMessage" } }
      teacherId: { type: [integer, "null"], description: "The teacher of a private conversation" }
      closed: { type: boolean, description: "The teacher no longer teaches here, so new messages cannot be sent" }
  MessageTeacher:
    type: object
    required: [id, name, title, photoId, classTeacher, subjects]
    properties:
      id: { type: integer }
      name: { type: string }
      title: { type: string }
      photoId: { type: [string, "null"] }
      classTeacher: { type: boolean }
      subjects: { type: array, items: { type: string }, description: "What they teach the student's class" }
  MyMessages:
    type: object
    required: [threads]
    properties:
      threads: { type: array, items: { $ref: "#/components/schemas/StudentThread" } }
      teachers: { type: array, items: { $ref: "#/components/schemas/MessageTeacher" }, description: "Teachers the student may write to privately: their class teacher and the teachers of their subjects" }
  MessageBodyInput:
    type: object
    required: [body]
    properties:
      body: { type: string, minLength: 1, maxLength: 1000 }
  StudentMessageInput:
    type: object
    required: [channel, body]
    properties:
      channel: { $ref: "#/components/schemas/MessageChannel" }
      body: { type: string, minLength: 1, maxLength: 1000 }
      teacherId: { type: integer, description: "For a private message: the teacher it goes to" }
  MessageReadInput:
    type: object
    required: [channel]
    properties:
      channel: { $ref: "#/components/schemas/MessageChannel" }
      teacherId: { type: integer }
  MessageThreadSummary:
    type: object
    required: [studentId, studentName, studentCode, className, channel, lastBody, lastAt, lastFromStaff, unread]
    properties:
      studentId: { type: integer }
      studentName: { type: string }
      studentCode: { type: string }
      className: { type: string }
      channel: { $ref: "#/components/schemas/MessageChannel" }
      lastBody: { type: string }
      lastAt: { type: string, format: date-time }
      lastFromStaff: { type: boolean }
      unread: { type: integer }
      teacherId: { type: [integer, "null"] }
      teacherName: { type: string, description: "For a private conversation: the teacher it is with" }
  StaffMessageThread:
    type: object
    required: [studentId, studentName, studentCode, className, channel, messages]
    properties:
      studentId: { type: integer }
      studentName: { type: string }
      studentCode: { type: string }
      className: { type: string }
      channel: { $ref: "#/components/schemas/MessageChannel" }
      messages: { type: array, items: { $ref: "#/components/schemas/PortalChatMessage" } }
      teacherId: { type: [integer, "null"] }
      teacherName: { type: string }
      canReply: { type: boolean, description: "False when the office reads a private teacher conversation: only that teacher answers" }
components:
  schemas:
    MessageChannel: { $ref: "#/schemas/MessageChannel" }
    PortalChatMessage: { $ref: "#/schemas/PortalChatMessage" }
    StudentThread: { $ref: "#/schemas/StudentThread" }
    MyMessages: { $ref: "#/schemas/MyMessages" }
    MessageTeacher: { $ref: "#/schemas/MessageTeacher" }
    MessageBodyInput: { $ref: "#/schemas/MessageBodyInput" }
    StudentMessageInput: { $ref: "#/schemas/StudentMessageInput" }
    MessageReadInput: { $ref: "#/schemas/MessageReadInput" }
    MessageThreadSummary: { $ref: "#/schemas/MessageThreadSummary" }
    StaffMessageThread: { $ref: "#/schemas/StaffMessageThread" }
