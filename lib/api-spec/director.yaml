paths:
  overview:
    get:
      operationId: getDirectorOverview
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, enum: [7, 30] } }
      responses:
        "200":
          description: The school's last seven days for the Director (Director only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectorReport" }
  sendReport:
    post:
      operationId: sendDirectorReport
      responses:
        "200":
          description: The weekly report was emailed to the Director
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
  broadcasts:
    get:
      operationId: listDirectorBroadcasts
      responses:
        "200":
          description: How many staff each audience reaches, and the emails sent so far (Director only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectorBroadcasts" }
    post:
      operationId: sendDirectorBroadcast
      description: Email teachers and/or administrators (Director only). Each person gets their own copy.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectorBroadcastInput" }
      responses:
        "200":
          description: What was sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectorBroadcast" }
schemas:
  DirectorBroadcastInput:
    type: object
    required: [audience, subject, message]
    properties:
      audience: { type: string, enum: [teachers, admins, all] }
      subject: { type: string, minLength: 1, maxLength: 150 }
      message: { type: string, minLength: 1, maxLength: 10000 }
  DirectorBroadcast:
    type: object
    required: [id, audience, subject, message, recipients, sent, failed, sentBy, createdAt]
    properties:
      id: { type: integer }
      audience: { type: string, enum: [teachers, admins, all] }
      subject: { type: string }
      message: { type: string }
      recipients: { type: integer }
      sent: { type: integer }
      failed: { type: integer }
      sentBy: { type: string }
      createdAt: { type: string }
  DirectorBroadcasts:
    type: object
    required: [counts, emailReady, history]
    properties:
      counts:
        type: object
        required: [teachers, admins, all]
        properties:
          teachers: { type: integer }
          admins: { type: integer }
          all: { type: integer }
      emailReady: { type: boolean }
      history: { type: array, items: { $ref: "#/components/schemas/DirectorBroadcast" } }
  DirectorReport:
    type: object
    required: [days, from, to, generatedAt, admissions, students, staff, attendance, learning, money, messages, website, security, highlights]
    properties:
      days: { type: integer }
      from: { type: string, format: date-time }
      to: { type: string, format: date-time }
      generatedAt: { type: string, format: date-time }
      admissions:
        type: object
        required: [newThisWeek, awaitingReview, total]
        properties:
          newThisWeek: { type: integer }
          awaitingReview: { type: integer }
          total: { type: integer }
      students:
        type: object
        required: [active, pendingActivation, activatedThisWeek, byClass]
        properties:
          active: { type: integer }
          pendingActivation: { type: integer }
          activatedThisWeek: { type: integer }
          byClass:
            type: array
            items:
              type: object
              required: [className, students]
              properties:
                className: { type: string }
                students: { type: integer }
      staff:
        type: object
        required: [activeTeachers]
        properties:
          activeTeachers: { type: integer }
      attendance:
        type: object
        required: [rate, recorded, absentToday, byClass]
        properties:
          rate: { type: [integer, "null"] }
          recorded: { type: integer }
          absentToday: { type: integer }
          byClass:
            type: array
            items:
              type: object
              required: [className, rate, recorded]
              properties:
                className: { type: string }
                rate: { type: [integer, "null"] }
                recorded: { type: integer }
      learning:
        type: object
        required: [examsHeld, attemptsSubmitted, averageScore, assignmentsSet, submissions]
        properties:
          examsHeld: { type: integer }
          attemptsSubmitted: { type: integer }
          averageScore: { type: [integer, "null"] }
          assignmentsSet: { type: integer }
          submissions: { type: integer }
      money:
        type: object
        required: [confirmedKobo, confirmedCount, awaitingKobo, awaitingCount, storeOrders, storeOrdersKobo]
        properties:
          confirmedKobo: { type: integer }
          confirmedCount: { type: integer }
          awaitingKobo: { type: integer }
          awaitingCount: { type: integer }
          storeOrders: { type: integer }
          storeOrdersKobo: { type: integer }
      messages:
        type: object
        required: [thisWeek, unanswered]
        properties:
          thisWeek: { type: integer }
          unanswered: { type: integer }
      website:
        type: object
        required: [liveUpdates]
        properties:
          liveUpdates: { type: integer }
      security:
        type: object
        required: [failedSignIns, deniedActions]
        properties:
          failedSignIns: { type: integer }
          deniedActions: { type: integer }
      highlights: { type: array, items: { type: string } }
components:
  schemas:
    DirectorReport: { $ref: "#/schemas/DirectorReport" }
    DirectorBroadcastInput: { $ref: "#/schemas/DirectorBroadcastInput" }
    DirectorBroadcast: { $ref: "#/schemas/DirectorBroadcast" }
    DirectorBroadcasts: { $ref: "#/schemas/DirectorBroadcasts" }
