paths:
  preview:
    post:
      operationId: previewStudentIdChange
      description: "The school office pastes its list of admission numbers and names; the portal pairs each with a student (nothing changes yet)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentIdListInput" }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentIdPlan" }
  apply:
    post:
      operationId: applyStudentIdChange
      description: "Give students their new admission numbers (the school office); they sign in with the new number from then on"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentIdChanges" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentIdChangeResult" }
  oldPreview:
    post:
      operationId: previewOldStudentIdCleanup
      description: "Students with an old-style ID, each paired with the new admission-number record of the same name (nothing changes yet)"
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OldStudentIdPlan" }
  oldApply:
    post:
      operationId: applyOldStudentIdCleanup
      description: "Join each old record to its new admission number (keeping results and history) and remove empty old records"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OldStudentIdCleanup" }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OldStudentIdCleanupResult" }
schemas:
  StudentIdListInput:
    type: object
    required: [text]
    properties:
      text: { type: string, maxLength: 300000 }
  StudentIdStudent:
    type: object
    required: [id, studentId, name, className, active]
    properties:
      id: { type: integer }
      studentId: { type: string }
      name: { type: string }
      className: { type: string }
      active: { type: boolean }
  StudentIdPlanRow:
    type: object
    required: [line, newId, name, status, student, message]
    properties:
      line: { type: integer }
      newId: { type: string }
      name: { type: string }
      status: { type: string, enum: [match, close, already, unmatched, ambiguous, problem, taken] }
      student:
        oneOf:
          - { $ref: "#/components/schemas/StudentIdStudent" }
          - { type: "null" }
      message: { type: string }
  StudentIdPlan:
    type: object
    required: [rows, notInList]
    properties:
      rows: { type: array, items: { $ref: "#/components/schemas/StudentIdPlanRow" } }
      notInList: { type: array, items: { $ref: "#/components/schemas/StudentIdStudent" } }
  StudentIdChanges:
    type: object
    required: [changes]
    properties:
      changes:
        type: array
        maxItems: 3000
        items:
          type: object
          required: [id, newId]
          properties:
            id: { type: integer }
            newId: { type: string, maxLength: 30 }
  StudentIdChangeResult:
    type: object
    required: [changed, message]
    properties:
      changed: { type: integer }
      message: { type: string }
  OldStudentIdPair:
    type: object
    required: [old, new, oldRecords, newRecords, status]
    properties:
      old: { $ref: "#/components/schemas/StudentIdStudent" }
      new: { $ref: "#/components/schemas/StudentIdStudent" }
      oldRecords: { type: array, items: { type: string } }
      newRecords: { type: array, items: { type: string } }
      status: { type: string, enum: [ready, new_has_records, ambiguous] }
  OldStudentIdUnpaired:
    type: object
    required: [student, records, note]
    properties:
      student: { $ref: "#/components/schemas/StudentIdStudent" }
      records: { type: array, items: { type: string } }
      note: { type: string }
  OldStudentIdPlan:
    type: object
    required: [pairs, unpaired, newOptions]
    properties:
      pairs: { type: array, items: { $ref: "#/components/schemas/OldStudentIdPair" } }
      unpaired: { type: array, items: { $ref: "#/components/schemas/OldStudentIdUnpaired" } }
      newOptions: { type: array, items: { $ref: "#/components/schemas/StudentIdStudent" } }
  OldStudentIdCleanup:
    type: object
    required: [join, remove]
    properties:
      join:
        type: array
        maxItems: 3000
        items:
          type: object
          required: [oldId, newId]
          properties:
            oldId: { type: integer }
            newId: { type: integer }
      remove: { type: array, maxItems: 3000, items: { type: integer } }
      purge:
        type: array
        maxItems: 3000
        description: Old records to remove together with everything recorded under them (results, attendance, CBT)
        items: { type: integer }
  OldStudentIdCleanupResult:
    type: object
    required: [joined, removed, message]
    properties:
      joined: { type: integer }
      removed: { type: integer }
      message: { type: string }
