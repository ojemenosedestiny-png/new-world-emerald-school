openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Academic Calendar
    description: Weekly academic calendar publishing.
  - name: Admissions
    description: Admission applications and school office review.
  - name: School Commerce
    description: School store orders and offline fee payment tracking.
paths:
  /website-admin/access:
    get:
      operationId: getWebsiteAdminAccess
      tags: [Website]
      summary: Check whether the signed-in account may manage this website
      responses:
        "200":
          description: Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebsiteAdminAccess"
  /site-content:
    get:
      operationId: getSiteContent
      tags: [Website]
      summary: Get published school website content
      responses:
        "200":
          description: Published content overrides
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
    put:
      operationId: updateSiteContent
      tags: [Website]
      summary: Save website content as an approved administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentInput"
      responses:
        "200":
          description: Saved content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContent"
        "403":
          description: Account is not approved to manage this school website
        "409":
          description: The revision has changed; reload before saving
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account:
    get:
      tags: [Account]
      operationId: getLocalAccount
      summary: Resolve the signed-in user's school account
      responses:
        "200":
          description: Local account resolved
          content:
            application/json:
              schema:
                type: object
                required: [id, isAdmin]
                properties:
                  id:
                    type: string
                  isAdmin:
                    type: boolean
        "401":
          description: Authentication required
  /storage/uploads/request-url:
    post:
      tags: [Academic Calendar]
      operationId: requestUploadUrl
      summary: Request a protected upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadMetadata"
      responses:
        "200":
          description: Presigned upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid upload metadata.
        "401":
          description: Authentication required.
  /academic-calendar:
    get:
      tags: [Academic Calendar]
      operationId: listAcademicCalendar
      summary: List published weekly calendars
      responses:
        "200":
          description: Published academic calendars.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademicCalendar"
    post:
      tags: [Academic Calendar]
      operationId: createAcademicCalendar
      summary: Publish a weekly academic calendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicCalendarInput"
      responses:
        "201":
          description: Calendar published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicCalendar"
        "401":
          description: Authentication required.
  /academic-calendar/{id}:
    delete:
      tags: [Academic Calendar]
      operationId: deleteAcademicCalendar
      summary: Remove a weekly academic calendar
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Calendar removed.
        "401":
          description: Authentication required.
        "404":
          description: Calendar not found.
  /admission-applications:
    post:
      tags: [Admissions]
      operationId: createAdmissionApplication
      summary: Submit an admission application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionApplicationInput"
      responses:
        "201":
          description: Application received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionApplicationReceipt"
        "400":
          description: Invalid application details.
    get:
      tags: [Admissions]
      operationId: listAdmissionApplications
      summary: List admission applications for school staff
      responses:
        "200":
          description: Admission applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdmissionApplication"
        "401":
          description: Authentication required.
  /admission-applications/{id}:
    patch:
      tags: [Admissions]
      operationId: updateAdmissionApplication
      summary: Update an admission application status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionApplicationStatusUpdate"
      responses:
        "200":
          description: Application updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionApplication"
        "400":
          description: Invalid application details.
        "401":
          description: Authentication required.
        "404":
          description: Application not found.
  /live-updates:
    get:
      tags: [Live Updates]
      operationId: listLiveUpdates
      summary: List published school live updates
      responses:
        "200":
          description: Published school update videos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LiveUpdate"
    post:
      tags: [Live Updates]
      operationId: createLiveUpdate
      summary: Publish a school live update video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveUpdateInput"
      responses:
        "201":
          description: Live update published.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveUpdate"
        "400":
          description: Invalid live update details.
        "401":
          description: Authentication required.
  /live-updates/{id}:
    patch:
      tags: [Live Updates]
      operationId: updateLiveUpdate
      summary: Update a school live update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveUpdateUpdate"
      responses:
        "200":
          description: Live update updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveUpdate"
        "400":
          description: Invalid live update details.
        "401":
          description: Authentication required.
        "404":
          description: Live update not found.
    delete:
      tags: [Live Updates]
      operationId: deleteLiveUpdate
      summary: Remove a school live update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Live update removed.
        "401":
          description: Authentication required.
        "404":
          description: Live update not found.
  /school-commerce/products:
    get:
      tags: [School Commerce]
      operationId: listStoreProducts
      summary: List active school store products
      responses:
        "200":
          description: Active school store products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreProduct"
    post:
      tags: [School Commerce]
      operationId: createStoreProduct
      summary: Add a school store product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreProductInput"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"
        "400":
          description: Invalid product details.
        "401":
          description: Authentication required.
  /school-commerce/management/products:
    get:
      tags: [School Commerce]
      operationId: listManagedStoreProducts
      summary: List all school store products for staff
      responses:
        "200":
          description: All school store products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreProduct"
        "401":
          description: Authentication required.
  /school-commerce/products/{id}:
    patch:
      tags: [School Commerce]
      operationId: updateStoreProduct
      summary: Update a school store product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreProductUpdate"
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProduct"
        "400":
          description: Invalid product details.
        "401":
          description: Authentication required.
        "404":
          description: Product not found.
    delete:
      tags: [School Commerce]
      operationId: deleteStoreProduct
      summary: Remove a school store product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Product removed.
        "401":
          description: Authentication required.
        "404":
          description: Product not found.
  /school-commerce/fee-schedules:
    get:
      tags: [School Commerce]
      operationId: listClassFeeSchedules
      summary: List active class fee schedules
      responses:
        "200":
          description: Active class fee schedules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassFeeSchedule"
    post:
      tags: [School Commerce]
      operationId: createClassFeeSchedule
      summary: Create a class fee schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassFeeScheduleInput"
      responses:
        "201":
          description: Class fee schedule created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassFeeSchedule"
        "400":
          description: Invalid fee schedule or duplicate class, term, and year.
        "401":
          description: Authentication required.
  /school-commerce/management/fee-schedules:
    get:
      tags: [School Commerce]
      operationId: listManagedClassFeeSchedules
      summary: List all class fee schedules for staff
      responses:
        "200":
          description: All class fee schedules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassFeeSchedule"
        "401":
          description: Authentication required.
  /school-commerce/fee-schedules/{id}:
    patch:
      tags: [School Commerce]
      operationId: updateClassFeeSchedule
      summary: Update a class fee schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassFeeScheduleUpdate"
      responses:
        "200":
          description: Class fee schedule updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassFeeSchedule"
        "400":
          description: Invalid fee schedule.
        "401":
          description: Authentication required.
        "404":
          description: Fee schedule not found.
    delete:
      tags: [School Commerce]
      operationId: deleteClassFeeSchedule
      summary: Remove a class fee schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Fee schedule removed.
        "401":
          description: Authentication required.
        "404":
          description: Fee schedule not found.
  /school-commerce/individual-charges:
    post:
      tags: [School Commerce]
      operationId: createIndividualFeeCharge
      summary: Create a private individual student fee charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualFeeChargeInput"
      responses:
        "201":
          description: Individual fee charge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualFeeCharge"
        "400":
          description: Invalid individual fee charge.
        "401":
          description: Authentication required.
  /school-commerce/management/individual-charges:
    get:
      tags: [School Commerce]
      operationId: listIndividualFeeCharges
      summary: List individual fee charges for staff
      responses:
        "200":
          description: Individual fee charges with student details.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IndividualFeeCharge"
        "401":
          description: Authentication required.
  /school-commerce/individual-charges/{id}:
    patch:
      tags: [School Commerce]
      operationId: updateIndividualFeeCharge
      summary: Update an individual fee charge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndividualFeeChargeUpdate"
      responses:
        "200":
          description: Individual fee charge updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndividualFeeCharge"
        "400":
          description: Invalid individual fee charge.
        "401":
          description: Authentication required.
        "404":
          description: Individual fee charge not found.
    delete:
      tags: [School Commerce]
      operationId: deleteIndividualFeeCharge
      summary: Remove an individual fee charge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Individual fee charge removed.
        "401":
          description: Authentication required.
        "404":
          description: Individual fee charge not found.
  /school-commerce/individual-charges/lookup/{reference}:
    get:
      tags: [School Commerce]
      operationId: lookupIndividualFeeCharge
      summary: Look up a private individual fee charge by its school-issued reference
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Safe payment details for the requested individual charge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicIndividualFeeCharge"
        "404":
          description: Charge not found or no longer payable.
  /school-commerce/orders:
    post:
      tags: [School Commerce]
      operationId: createStoreOrder
      summary: Submit a school store order request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderInput"
      responses:
        "201":
          description: Store order request submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrderReceipt"
        "400":
          description: Invalid order details.
        "409":
          description: A requested product is unavailable or out of stock.
    get:
      tags: [School Commerce]
      operationId: listStoreOrders
      summary: List store order requests for staff
      responses:
        "200":
          description: Store orders, including parent contact details.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreOrder"
        "401":
          description: Authentication required.
  /school-commerce/orders/{id}:
    patch:
      tags: [School Commerce]
      operationId: updateStoreOrder
      summary: Update store order and manual payment status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreOrderUpdate"
      responses:
        "200":
          description: Store order updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreOrder"
        "400":
          description: Invalid order update.
        "401":
          description: Authentication required.
        "404":
          description: Order not found.
  /school-commerce/fee-reports:
    post:
      tags: [School Commerce]
      operationId: submitFeePaymentReport
      summary: Request or report an offline school fee payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeePaymentReportInput"
      responses:
        "201":
          description: Fee payment request received.
          content:
            application/json:
              schema:
                    $ref: "#/components/schemas/FeePaymentReportReceipt"
        "400":
          description: Invalid fee payment details.
        "404":
          description: Fee schedule or individual charge not found.
        "409":
          description: Individual charge is no longer payable or already has a pending report.
    get:
      tags: [School Commerce]
      operationId: listFeePaymentReports
      summary: List school fee payment requests for staff
      responses:
        "200":
          description: Fee payment requests, including student and parent details.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeePaymentReport"
        "401":
          description: Authentication required.
  /school-commerce/fee-reports/{id}:
    patch:
      tags: [School Commerce]
      operationId: updateFeePaymentReport
      summary: Verify a reported offline school fee payment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeePaymentReportUpdate"
      responses:
        "200":
          description: Fee payment report updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeePaymentReport"
        "400":
          description: Invalid payment update.
        "401":
          description: Authentication required.
        "404":
          description: Payment report not found.
  /school-commerce/settings:
    get:
      tags: [School Commerce]
      operationId: getSchoolCommerceSettings
      summary: Get public offline payment instructions
      responses:
        "200":
          description: Current public payment instructions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolCommerceSettings"
    put:
      tags: [School Commerce]
      operationId: updateSchoolCommerceSettings
      summary: Update public offline payment instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolCommerceSettingsUpdate"
      responses:
        "200":
          description: Payment instructions updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolCommerceSettings"
        "401":
          description: Authentication required.
components:
  schemas:
    WebsiteAdminAccess:
      type: object
      required: [isAdmin]
      properties:
        isAdmin:
          type: boolean
    SiteContent:
      type: object
      required: [revision, values, updatedAt]
      properties:
        revision:
          type: integer
          minimum: 0
        values:
          type: object
          additionalProperties:
            type: string
        updatedAt:
          type: [string, "null"]
    SiteContentInput:
      type: object
      required: [revision, values]
      properties:
        revision:
          type: integer
          minimum: 0
        values:
          type: object
          additionalProperties:
            type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadMetadata:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadMetadata"
    AcademicCalendar:
      type: object
      required: [id, title, weekStart, weekEnd, term, fileName, objectPath, contentType, fileSize, uploadedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
        term:
          type: string
        fileName:
          type: string
        objectPath:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
        uploadedAt:
          type: string
          format: date-time
    AcademicCalendarInput:
      type: object
      required: [title, weekStart, weekEnd, term, fileName, objectPath, contentType, fileSize]
      properties:
        title:
          type: string
          minLength: 1
        weekStart:
          type: string
          format: date
        weekEnd:
          type: string
          format: date
        term:
          type: string
          minLength: 1
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1
        contentType:
          type: string
          minLength: 1
        fileSize:
          type: integer
          minimum: 1
    LiveUpdate:
      type: object
      required: [id, title, description, fileName, objectPath, contentType, fileSize, publishedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        fileName:
          type: string
        objectPath:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
        publishedAt:
          type: string
          format: date-time
    LiveUpdateInput:
      type: object
      required: [title, description, fileName, objectPath, contentType, fileSize]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1
        contentType:
          type: string
          minLength: 1
        fileSize:
          type: integer
          minimum: 1
    LiveUpdateUpdate:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        fileName:
          type: string
          minLength: 1
        objectPath:
          type: string
          minLength: 1
        contentType:
          type: string
          minLength: 1
        fileSize:
          type: integer
          minimum: 1
    AdmissionApplication:
      type: object
      required: [id, studentFirstName, studentLastName, grade, entryYear, guardianEmail, guardianPhone, status, submittedAt]
      properties:
        id:
          type: integer
        studentFirstName:
          type: string
        studentLastName:
          type: string
        grade:
          type: string
        entryYear:
          type: string
        guardianEmail:
          type: string
        guardianPhone:
          type: string
        status:
          type: string
        submittedAt:
          type: string
          format: date-time
    AdmissionApplicationInput:
      type: object
      required: [studentFirstName, studentLastName, grade, entryYear, guardianEmail, guardianPhone]
      properties:
        studentFirstName:
          type: string
          minLength: 1
        studentLastName:
          type: string
          minLength: 1
        grade:
          type: string
          minLength: 1
        entryYear:
          type: string
          minLength: 1
        guardianEmail:
          type: string
          minLength: 3
        guardianPhone:
          type: string
          minLength: 7
    AdmissionApplicationReceipt:
      type: object
      required: [id, studentFirstName, status, submittedAt]
      properties:
        id:
          type: integer
        studentFirstName:
          type: string
        status:
          type: string
        submittedAt:
          type: string
          format: date-time
    AdmissionApplicationStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          minLength: 1
    StoreProduct:
      type: object
      required: [id, title, description, category, variant, priceKobo, stock, imageUrl, isActive, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
          enum: [uniform, books, supplies, other]
        variant:
          type: string
        priceKobo:
          type: integer
        stock:
          type: [integer, "null"]
        imageUrl:
          type: [string, "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StoreProductInput:
      type: object
      required: [title, description, category, variant, priceKobo, stock, imageUrl, isActive]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        category:
