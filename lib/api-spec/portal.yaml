paths:
  session:
    get:
      operationId: getPortalSession
      responses:
        "200":
          description: Current portal identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSession" }
    post:
      operationId: loginPortalStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalLogin" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalSession" }
    delete:
      operationId: logoutPortalStudent
      responses:
        "204": { description: Signed out }
  password:
    put:
      operationId: changePortalPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalPassword" }
      responses:
        "204": { description: Password changed }
  student:
    get:
      operationId: getPortalDashboard
      responses:
        "200":
          description: Class learning dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalDashboard" }
  start:
    post:
      operationId: startPortalExam
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: New or resumed attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalAttempt" }
  attemptScript:
    get:
      operationId: getStaffAttemptScript
      description: One student's whole script for marking (paper with answer key, answers, marks); staff who manage the exam only
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The script
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalStaffAttempt" }
  attempt:
    get:
      operationId: getPortalAttempt
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Private student attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalAttempt" }
    put:
      operationId: savePortalAnswers
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalAnswerInput" }
      responses:
        "200":
          description: Answers saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalAttempt" }
  submit:
    post:
      operationId: submitPortalAttempt
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalAnswerInput" }
      responses:
        "200":
          description: Submitted for marking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalAttempt" }
  focusLoss:
    post:
      operationId: reportPortalFocusLoss
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The student left the exam screen during a lockdown exam; returns the running count
          content:
            application/json:
              schema:
                type: object
                required: [focusLosses]
                properties:
                  focusLosses: { type: integer }
  manage:
    get:
      operationId: getPortalManagement
      responses:
        "200":
          description: Data within the staff member's permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalManagement" }
    post:
      operationId: managePortal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortalCommand" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalMessage" }
  classStudents:
    get:
      operationId: listClassStudents
      description: The active students of one class (name and Student ID only), so staff can set an exam for particular students of any class
      parameters:
        - { name: classId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Students, by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PortalClassStudent" } }
  import:
    post:
      operationId: importPortalPdf
      parameters:
        - { name: classId, in: query, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Private PDF and draft extracted questions, never auto-published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalPdfImport" }
  file:
    get:
      operationId: getPortalFile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authorized PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
  diagrams:
    post:
      operationId: uploadPortalDiagram
      description: Staff attach a diagram picture (PNG, JPEG or WebP, up to 3 MB) to a question.
      parameters:
        - { name: classId, in: query, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored privately for this class
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortalDiagram" }
  diagram:
    get:
      operationId: getPortalDiagram
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Diagram picture, for staff of the class or a student who has the question in an attempt
          content:
            image/png:
              schema: { type: string, format: binary }
schemas:
  PortalLogin:
    type: object
    required: [studentId, password]
    properties:
      studentId: { type: string, minLength: 1, maxLength: 50 }
      password: { type: string, minLength: 1, maxLength: 128 }
  PortalPassword:
    type: object
    required: [currentPassword, newPassword]
    properties:
      currentPassword: { type: string, minLength: 1, maxLength: 128 }
      newPassword: { type: string, minLength: 10, maxLength: 128 }
  PortalSession:
    type: object
    required: [role, name, mustChangePassword, classIds]
    properties:
      role: { type: string, enum: [guest, student, teacher, admin] }
      name: { type: string }
      studentId: { type: string }
      classId: { type: integer }
      classIds: { type: array, items: { type: integer } }
      mustChangePassword: { type: boolean }
      superAdmin: { type: boolean }
      mfaRequired: { type: boolean }
  PortalClass:
    type: object
    required: [name]
    properties:
      id: { type: integer }
      name: { type: string, minLength: 1, maxLength: 100 }
  PortalStudent:
    type: object
    required: [studentId, name, classId, active]
    properties:
      id: { type: integer }
      studentId: { type: string, maxLength: 50, description: "Leave empty on a new enrolment to create the next automatic Student ID" }
      name: { type: string, minLength: 1, maxLength: 150 }
      classId: { type: integer }
      active: { type: boolean }
      password: { type: string, minLength: 10, maxLength: 128 }
      guardianEmail: { type: [string, "null"], maxLength: 200 }
      accountStatus: { type: string, enum: [pending, active] }
      photoImageId: { type: [string, "null"], readOnly: true }
  PortalTeacher:
    type: object
    required: [email, name, classIds, active]
    properties:
      id: { type: integer }
      email: { type: string, minLength: 3, maxLength: 200 }
      name: { type: string, minLength: 1, maxLength: 150 }
      classIds: { type: array, items: { type: integer } }
      active: { type: boolean }
      title: { type: string, maxLength: 80, description: Role shown in the staff directory }
      subjects: { type: array, maxItems: 12, items: { type: string, maxLength: 60 } }
      showInDirectory: { type: boolean }
      photoFileId: { type: [string, "null"], readOnly: true, description: Set through the staff photo upload }
  PortalQuestion:
    type: object
    required: [id, type, text, options, marks]
    properties:
      id: { type: string, minLength: 1, maxLength: 80 }
      type: { type: string, enum: [mcq, written] }
      text: { type: string, minLength: 1, maxLength: 12000 }
      options: { type: array, items: { type: string, maxLength: 3000 }, maxItems: 8 }
      marks: { type: number, minimum: 0.5, maximum: 100 }
      passage: { type: string, maxLength: 20000, description: Shared passage or instructions shown above the question }
      diagramFileId: { type: [string, "null"], maxLength: 80, description: Diagram picture uploaded for the question }
  PortalQuestionKey:
    allOf:
      - { $ref: "#/schemas/PortalQuestion" }
      - type: object
        properties:
          correctAnswer: { type: [integer, "null"] }
          rubric: { type: string, maxLength: 5000 }
  PortalExam:
    type: object
    required: [title, subject, classId, durationMinutes, startsAt, endsAt, mode, instructions, questions, published, resultsReleased]
    properties:
      id: { type: integer }
      title: { type: string, minLength: 1, maxLength: 200 }
      subject: { type: string, minLength: 1, maxLength: 100 }
      classId: { type: integer }
      durationMinutes: { type: integer, minimum: 1, maximum: 300 }
      startsAt: { type: string }
      endsAt: { type: string }
      mode: { type: string, enum: [interactive, pdf] }
      fileId: { type: [string, "null"] }
      instructions: { type: string, maxLength: 5000 }
      questions: { type: array, items: { $ref: "#/schemas/PortalQuestionKey" }, maxItems: 200 }
      published: { type: boolean }
      resultsReleased: { type: boolean }
      shuffleQuestions: { type: boolean, description: Each student gets the questions in a different order }
      shuffleOptions: { type: boolean, description: Each student gets multiple-choice options in a different order }
      drawCount: { type: integer, minimum: 0, maximum: 200, description: "Question bank: questions per student, drawn at random (0 = all)" }
      lockdown: { type: boolean, description: "Full screen, no copy or paste, and exits from the exam screen are recorded" }
      reviewStatus: { type: string, readOnly: true, description: "Exam officer review: empty (draft), submitted, returned or approved. Set by the server only" }
      reviewNote: { type: string, readOnly: true, description: "The exam officer's note when an exam is returned" }
      instantResults: { type: boolean, description: "After submitting, each student sees the right answer to every multiple-choice question; scores wait for release" }
      onlyStudentIds: { type: [array, "null"], items: { type: integer }, maxItems: 200, description: "Only these students of the class see and write the exam (for example one child who missed it). Empty or absent: the whole class" }
      paperGroup: { type: [string, "null"], readOnly: true, description: "Copies of one paper set for several classes share this; saved changes reach every copy. Set by the server only" }
  PortalExamSummary:
    type: object
    required: [id, title, subject, durationMinutes, startsAt, endsAt, mode, instructions, questionCount, totalMarks]
    properties:
      id: { type: integer }
      title: { type: string }
      subject: { type: string }
      durationMinutes: { type: integer }
      startsAt: { type: string }
      endsAt: { type: string }
      mode: { type: string }
      instructions: { type: string }
      questionCount: { type: integer }
      totalMarks: { type: number }
      lockdown: { type: boolean }
      makeUp: { type: boolean, description: "A make-up sitting set for this student alone: the window shown is theirs" }
  PortalMark:
    type: object
    required: [questionId, score, feedback]
    properties:
      questionId: { type: string }
      score: { type: number, minimum: 0 }
      feedback: { type: string, maxLength: 3000 }
  PortalAttempt:
    type: object
    required: [id, examId, title, subject, mode, instructions, questions, answers, startedAt, deadline, serverNow, status, savedAt, totalMarks, resultsReleased]
    properties:
      id: { type: integer }
      examId: { type: integer }
      title: { type: string }
      subject: { type: string }
      mode: { type: string }
      instructions: { type: string }
      fileId: { type: [string, "null"] }
      questions: { type: array, items: { $ref: "#/schemas/PortalQuestion" } }
      answers: { type: object, additionalProperties: { type: string } }
      startedAt: { type: string }
      deadline: { type: string }
      serverNow: { type: string }
      status: { type: string, enum: [in_progress, submitted, marked] }
      savedAt: { type: string }
      totalMarks: { type: number }
      resultsReleased: { type: boolean }
      score: { type: number }
      marks: { type: array, items: { $ref: "#/schemas/PortalMark" } }
      lockdown: { type: boolean }
      focusLosses: { type: integer }
      answersAt: { type: string, description: "Submitted while the exam is still open: when the right answers will show (the exam's closing time)" }
      lateAnswersSent: { type: boolean, description: "This computer sent more answers after time ran out; the teacher will accept or ignore them" }
      review:
        type: array
        description: After submitting and once the exam has closed, the right answer to each multiple-choice question (no score)
        items:
          type: object
          required: [questionId, correctAnswer, correct]
          properties:
            questionId: { type: string }
            correctAnswer: { type: integer }
            correct: { type: boolean }
  PortalAnswerInput:
    type: object
    required: [answers]
    properties:
      answers: { type: object, additionalProperties: { type: string, maxLength: 20000 } }
  PortalMaterial:
    type: object
    required: [title, subject, classId, body, published]
    properties:
      id: { type: integer }
      title: { type: string, minLength: 1, maxLength: 200 }
      subject: { type: string, minLength: 1, maxLength: 100 }
      classId: { type: integer }
      body: { type: string, maxLength: 30000 }
      fileId: { type: [string, "null"] }
      published: { type: boolean }
  PortalNotice:
    type: object
    required: [title, body, classId, published]
    properties:
      id: { type: integer }
      title: { type: string, minLength: 1, maxLength: 200 }
      body: { type: string, minLength: 1, maxLength: 5000 }
      classId: { type: integer }
      published: { type: boolean }
  PortalDashboard:
    type: object
    required: [className, exams, attempts, materials, notices]
    properties:
      serverNow: { type: string, format: date-time, description: "The server's clock, so a computer with a wrong clock still shows exams open at the right time" }
      className: { type: string }
      exams: { type: array, items: { $ref: "#/schemas/PortalExamSummary" } }
      attempts: { type: array, items: { $ref: "#/schemas/PortalAttempt" } }
      materials: { type: array, items: { $ref: "#/schemas/PortalMaterial" } }
      notices: { type: array, items: { $ref: "#/schemas/PortalNotice" } }
  PortalStaffAttempt:
    allOf:
      - { $ref: "#/schemas/PortalAttempt" }
      - type: object
        required: [studentName, studentId, classId, questionKeys]
        properties:
          studentName: { type: string }
          studentId: { type: string }
          classId: { type: integer }
          questionKeys: { type: array, items: { $ref: "#/schemas/PortalQuestionKey" } }
          closedBy: { type: [string, "null"], description: "student: they pressed Submit in time; time: time ran out first. Empty for older scripts" }
          lateAnswerCount: { type: integer, description: "Answers the student's computer sent after time ran out (offline), waiting for the teacher to accept or ignore" }
          lateAnswersAt: { type: [string, "null"], format: date-time }
          submittedAt: { type: [string, "null"], format: date-time }
  PortalManagement:
    type: object
    required: [classes, students, teachers, exams, attempts, materials, notices]
    properties:
      classes: { type: array, items: { $ref: "#/schemas/PortalClass" } }
      examClasses:
        type: array
        description: Every class an exam may be set for (teachers may set exams for any class, not only their own)
        items:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
      students: { type: array, items: { $ref: "#/schemas/PortalStudent" } }
      teachers: { type: array, items: { $ref: "#/schemas/PortalTeacher" } }
      exams: { type: array, items: { $ref: "#/schemas/PortalExam" } }
      attempts: { type: array, items: { $ref: "#/schemas/PortalStaffAttempt" } }
      materials: { type: array, items: { $ref: "#/schemas/PortalMaterial" } }
      notices: { type: array, items: { $ref: "#/schemas/PortalNotice" } }
      teaching: { $ref: "#/schemas/PortalTeaching" }
      examOfficer: { type: boolean, description: "The school has an exam officer: staff send exams to them to publish" }
      makeups: { type: array, items: { $ref: "#/schemas/PortalMakeup" }, description: "Make-up sittings for the exams listed" }
  PortalTeaching:
    type: object
    description: For a teacher, what the principal or office assigned them. Absent for administrators.
    required: [classTeacherOf, subjects]
    properties:
      classTeacherOf: { type: array, items: { $ref: "#/schemas/PortalTeachingClass" } }
      subjects: { type: array, items: { $ref: "#/schemas/PortalTeachingSubject" } }
  PortalTeachingClass:
    type: object
    required: [id, name]
    properties:
      id: { type: integer }
      name: { type: string }
  PortalTeachingSubject:
    type: object
    required: [subjectId, subject, classId, className]
    properties:
      subjectId: { type: integer }
      subject: { type: string }
      classId: { type: integer }
      className: { type: string }
  PortalGrade:
    type: object
    required: [attemptId, marks]
    properties:
      attemptId: { type: integer }
      marks: { type: array, items: { $ref: "#/schemas/PortalMark" } }
  PortalStatus:
    type: object
    required: [id, published, resultsReleased]
    properties:
      id: { type: integer }
      published: { type: boolean }
      resultsReleased: { type: boolean }
  PortalCommand:
    type: object
    required: [action]
    properties:
      action: { type: string, enum: [saveClass, saveStudent, saveTeacher, saveExam, saveMaterial, saveNotice, grade, examStatus, deleteExam, deleteMaterial, deleteNotice, extendAttempt, resetAttempt, reopenAttempt, acceptLateAnswers, ignoreLateAnswers, addPracticeExams, inviteTeacher, deleteClass, deleteTeacher, moveStudent, setMakeup, removeMakeup] }
      makeup: { $ref: "#/schemas/PortalMakeupInput" }
      schoolClass: { $ref: "#/schemas/PortalClass" }
      student: { $ref: "#/schemas/PortalStudent" }
      teacher: { $ref: "#/schemas/PortalTeacher" }
      exam: { $ref: "#/schemas/PortalExam" }
      material: { $ref: "#/schemas/PortalMaterial" }
      notice: { $ref: "#/schemas/PortalNotice" }
      grade: { $ref: "#/schemas/PortalGrade" }
      examStatus: { $ref: "#/schemas/PortalStatus" }
      target: { $ref: "#/schemas/PortalTarget" }
      attemptControl: { $ref: "#/schemas/PortalAttemptControl" }
      withAttempts: { type: boolean, description: "deleteExam only: also delete every student's attempt and score for the exam (the school owner only, for clearing test exams)" }
      toClassId: { type: integer, description: "moveStudent only: the class to move the student (target) into" }
      alsoClassIds: { type: array, items: { type: integer }, description: "saveExam (a new exam) only: also set the same exam for these classes, for example every Year 11 class" }
      linked: { type: boolean, description: "saveExam (an existing exam) only: false keeps the change to this class; otherwise it also reaches the paper's copies in other classes that no student has started" }
  PortalTarget:
    type: object
    required: [id]
    properties:
      id: { type: integer }
  PortalClassStudent:
    type: object
    required: [id, name, studentId]
    properties:
      id: { type: integer }
      name: { type: string }
      studentId: { type: string }
  PortalMakeupInput:
    type: object
    required: [examId, studentIds]
    description: "setMakeup: give students who missed an exam their own window (startsAt, endsAt). removeMakeup: take it away again"
    properties:
      examId: { type: integer }
      studentIds: { type: array, items: { type: integer }, minItems: 1, maxItems: 200 }
      startsAt: { type: string, format: date-time }
      endsAt: { type: string, format: date-time }
  PortalMakeup:
    type: object
    required: [examId, studentId, startsAt, endsAt, createdBy]
    properties:
      examId: { type: integer }
      studentId: { type: integer }
      startsAt: { type: string, format: date-time }
      endsAt: { type: string, format: date-time }
      createdBy: { type: string }
  PortalAttemptControl:
    type: object
    required: [attemptId]
    properties:
      attemptId: { type: integer }
      minutes: { type: integer, minimum: 1, maximum: 240 }
  PortalMessage:
    type: object
    required: [message]
    properties:
      message: { type: string }
      studentId: { type: string, description: The Student ID of a student just enrolled }
  PortalPdfImport:
    type: object
    required: [fileId, questions, warning, extractedText, passages, notes]
    properties:
      fileId: { type: string }
      questions: { type: array, items: { $ref: "#/schemas/PortalQuestionKey" } }
      warning: { type: string }
      extractedText: { type: string }
      passages:
        type: array
        description: Passages, instructions and headings found outside questions, with the question numbers they name
        items:
          type: object
          required: [text, from, to, before]
          properties:
            text: { type: string }
            from: { type: [integer, "null"] }
            to: { type: [integer, "null"] }
            before: { type: [integer, "null"], description: The printed number of the question that follows }
      notes:
        type: array
        description: Review notes, such as diagrams that were attached or could not be imported
        items:
          type: object
          required: [question, message]
          properties:
            question: { type: [integer, "null"], description: Position of the question in the list (0-based) }
            message: { type: string }
  PortalDiagram:
    type: object
    required: [fileId]
    properties:
      fileId: { type: string }
components:
  schemas:
    PortalLogin: { $ref: "#/schemas/PortalLogin" }
    PortalPassword: { $ref: "#/schemas/PortalPassword" }
    PortalSession: { $ref: "#/schemas/PortalSession" }
    PortalClass: { $ref: "#/schemas/PortalClass" }
    PortalStudent: { $ref: "#/schemas/PortalStudent" }
    PortalTeacher: { $ref: "#/schemas/PortalTeacher" }
    PortalQuestion: { $ref: "#/schemas/PortalQuestion" }
    PortalQuestionKey: { $ref: "#/schemas/PortalQuestionKey" }
    PortalExam: { $ref: "#/schemas/PortalExam" }
    PortalExamSummary: { $ref: "#/schemas/PortalExamSummary" }
    PortalMark: { $ref: "#/schemas/PortalMark" }
    PortalAttempt: { $ref: "#/schemas/PortalAttempt" }
    PortalAnswerInput: { $ref: "#/schemas/PortalAnswerInput" }
    PortalMaterial: { $ref: "#/schemas/PortalMaterial" }
    PortalNotice: { $ref: "#/schemas/PortalNotice" }
    PortalDashboard: { $ref: "#/schemas/PortalDashboard" }
    PortalStaffAttempt: { $ref: "#/schemas/PortalStaffAttempt" }
    PortalManagement: { $ref: "#/schemas/PortalManagement" }
    PortalGrade: { $ref: "#/schemas/PortalGrade" }
    PortalStatus: { $ref: "#/schemas/PortalStatus" }
    PortalCommand: { $ref: "#/schemas/PortalCommand" }
    PortalTarget: { $ref: "#/schemas/PortalTarget" }
    PortalAttemptControl: { $ref: "#/schemas/PortalAttemptControl" }
    PortalMakeupInput: { $ref: "#/schemas/PortalMakeupInput" }
    PortalClassStudent: { $ref: "#/schemas/PortalClassStudent" }
    PortalMakeup: { $ref: "#/schemas/PortalMakeup" }
    PortalMessage: { $ref: "#/schemas/PortalMessage" }
    PortalPdfImport: { $ref: "#/schemas/PortalPdfImport" }
    PortalDiagram: { $ref: "#/schemas/PortalDiagram" }
