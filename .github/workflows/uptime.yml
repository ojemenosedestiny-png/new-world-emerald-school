name: Website uptime

# Checks every hour that the website and its database answer. A failed run makes GitHub email the
# repository owner, so an outage is known within the hour. What to do then: docs/DISASTER-RECOVERY.md.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Website and API answer
        run: |
          site=https://newworldemeraldprivateschool.com
          ok() { curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 -o /dev/null -w "%{http_code} in %{time_total}s" "$1"; }
          echo "Home page: $(ok "$site/")"
          echo "API health: $(ok "$site/api/healthz")"
          # The calendar reads the database, so this fails if the database is down.
          echo "Database (school calendar): $(ok "$site/api/academic-calendar")"
