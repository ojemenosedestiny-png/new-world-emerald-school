name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Disposable database for the portal control tests; never a real school database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: school_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: API auth tests
        run: pnpm --filter @workspace/api-server run test:auth

      - name: API storage tests
        run: pnpm --filter @workspace/api-server run test:storage

      - name: API server build
        run: pnpm --filter @workspace/api-server run build

      - name: Frontend tests
        run: |
          pnpm --filter @workspace/new-world-emerald run test:photo-entry
          pnpm --filter @workspace/new-world-emerald run test:photo-url
          pnpm --filter @workspace/new-world-emerald run test:build-check

      - name: Frontend build and bundle budget
        run: pnpm --filter @workspace/new-world-emerald run check:build

      - name: API codegen is reproducible
        run: pnpm run test:api-regeneration

      - name: Portal exam control and report card tests (disposable Postgres)
        env:
          DATABASE_URL: postgresql://school:ci-only@localhost:5432/school_test
        run: |
          pnpm --filter @workspace/db run push
          pnpm --filter @workspace/api-server run test:portal-control
          pnpm --filter @workspace/api-server run test:portal-reports
          pnpm --filter @workspace/api-server run test:portal-security
          pnpm --filter @workspace/api-server run test:portal-accounts
          pnpm --filter @workspace/api-server run test:portal-community
          pnpm --filter @workspace/api-server run test:portal-media
          pnpm --filter @workspace/api-server run test:media-storage

      # test:portal also needs Replit object storage, so it is run on Replit.
