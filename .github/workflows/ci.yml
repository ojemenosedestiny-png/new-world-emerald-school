name: CI

on:
  push:
    # main, the working branch, and the branch Render deploys.
    branches: [main, portal-upgrade, chore/hardening-and-tooling]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Disposable database for the portal control tests; never a real school database.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: school_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U school" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: API auth tests
        run: pnpm --filter @workspace/api-server run test:auth

      - name: API storage tests
        run: pnpm --filter @workspace/api-server run test:storage

      - name: API server build
        run: pnpm --filter @workspace/api-server run build

      - name: Built server imports resolve (as on Render)
        run: node artifacts/api-server/check-dist-imports.mjs

      - name: Frontend tests
        run: |
          pnpm --filter @workspace/new-world-emerald run test:photo-entry
          pnpm --filter @workspace/new-world-emerald run test:photo-url
          pnpm --filter @workspace/new-world-emerald run test:build-check

      - name: Frontend build and bundle budget
        run: pnpm --filter @workspace/new-world-emerald run check:build

      - name: API codegen is reproducible
        run: pnpm run test:api-regeneration

      - name: Portal exam control and report card tests (disposable Postgres)
        env:
          DATABASE_URL: postgresql://school:ci-only@localhost:5432/school_test
        run: |
          pnpm --filter @workspace/db run push
          pnpm --filter @workspace/api-server run test:portal-control
          pnpm --filter @workspace/api-server run test:portal-reports
          pnpm --filter @workspace/api-server run test:portal-security
          pnpm --filter @workspace/api-server run test:portal-accounts
          pnpm --filter @workspace/api-server run test:portal-community
          pnpm --filter @workspace/api-server run test:portal-media
          pnpm --filter @workspace/api-server run test:media-storage
          pnpm --filter @workspace/api-server run test:school-payments
          pnpm --filter @workspace/api-server run test:portal-learning
          pnpm --filter @workspace/api-server run test:portal-messages
          pnpm --filter @workspace/api-server run test:portal-fees
          pnpm --filter @workspace/api-server run test:portal-cbt
          pnpm --filter @workspace/api-server run test:portal-teachers
          pnpm --filter @workspace/api-server run test:portal-director
          pnpm --filter @workspace/api-server run test:portal-inventory
          pnpm --filter @workspace/api-server run test:portal-result-import
          pnpm --filter @workspace/api-server run test:portal-facilities
          pnpm --filter @workspace/api-server run test:portal-parent
          pnpm --filter @workspace/api-server run test:portal-principal
          pnpm --filter @workspace/api-server run test:portal-principal-oversight
          pnpm --filter @workspace/api-server run test:portal-primary-results
          pnpm --filter @workspace/api-server run test:portal-term-rename
          pnpm --filter @workspace/api-server run test:portal-exam-officer
          pnpm --filter @workspace/api-server run test:portal-head-and-parents
          pnpm --filter @workspace/api-server run test:portal-timetables
          pnpm --filter @workspace/api-server run test:portal-transfers
          pnpm --filter @workspace/api-server run test:school-accounts
          pnpm --filter @workspace/api-server run test:portal-class-delete
          pnpm --filter @workspace/api-server run test:portal-signatures
          pnpm --filter @workspace/api-server run test:school-export
          pnpm --filter @workspace/api-server run test:student-profiles
          pnpm --filter @workspace/api-server run test:assistant
          pnpm --filter @workspace/api-server run test:subject-fix
          pnpm --filter @workspace/api-server run test:route-security
          pnpm --filter @workspace/api-server run test:principal-students
          pnpm --filter @workspace/api-server run test:tap-in

      - name: Backup and restore round trip (disposable Postgres)
        env:
          DATABASE_URL: postgresql://school:ci-only@localhost:5432/school_test
          BACKUP_PASSPHRASE: ci-only-passphrase-not-a-secret
          RESTORE_CONFIRM: "yes"
        run: |
          psql "$DATABASE_URL" -X -q -c "insert into portal_classes (name) values ('CI backup check JSS 1')"
          file=$(bash scripts/backup-db.sh "$RUNNER_TEMP/backups")
          psql "$DATABASE_URL" -X -q -c "create database restore_check"
          TARGET_DATABASE_URL=postgresql://school:ci-only@localhost:5432/restore_check bash scripts/restore-backup.sh "$file"
          test "$(psql postgresql://school:ci-only@localhost:5432/restore_check -X -At -c "select count(*) from portal_classes where name = 'CI backup check JSS 1'")" = 1

      # test:portal also needs Replit object storage, so it is run on Replit.
